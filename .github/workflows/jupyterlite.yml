name: Build JupyterLite for Docs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlite-core jupyter_server jupyterlite-pyodide-kernel

      - name: Build JupyterLite site into docs/
        run: |
          jupyter lite build --contents content --output-dir docs

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/*
          git commit -m "Build JupyterLite site and push docs" || echo "No changes to commit"
          git push