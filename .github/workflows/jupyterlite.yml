name: Build JupyterLite for Docs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlite-core jupyterlite-python

      - name: Build JupyterLite site into docs/
        run: |
          jupyter lite build --contents content --output-dir docs

      - name: Commit and push changes to docs/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build JupyterLite site and update docs/"
          file_pattern: "docs/*"